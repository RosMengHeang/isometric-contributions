<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>isometric-contributions · Your GitHub contributions, built as a city</title>
    <meta
      name="description"
      content="Open-source React component, SVG renderer, CLI, and GitHub Action that draws your GitHub contribution calendar as a 3D city, a 2D skyline, or a classic grid."
    />
    <meta property="og:title" content="isometric-contributions" />
    <meta
      property="og:description"
      content="Your GitHub contributions, built as a city. Four styles, eight themes, and one-line install for any portfolio."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2340c463' d='M2 5.2 8 2l6 3.2-6 3.2z'/%3E%3Cpath fill='%2330a14e' d='M2 5.2 8 8.4V15L2 11.8z'/%3E%3Cpath fill='%23216e39' d='M8 8.4 14 5.2V11.8L8 15z'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var saved = localStorage.getItem("iso-theme")
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
